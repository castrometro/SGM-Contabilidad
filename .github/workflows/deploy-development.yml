name: Deploy to Development

on:
  push:
    branches:
      - development
  workflow_dispatch:  # Permite ejecución manual

jobs:
  build-and-deploy:
    runs-on: self-hosted  # Usa el runner instalado en servidor de desarrollo
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install frontend dependencies
        run: npm ci
      
      - name: Build frontend
        env:
          VITE_MEDIA_BASE_URL: http://172.17.11.22:8000  # Servidor de desarrollo (vm-bdo-q)
        run: npm run build
      
      - name: Deploy to Django static directory
        run: |
          # Backup del build anterior
          if [ -d "backend/static/dist" ]; then
            rm -rf backend/static/dist.backup
            mv backend/static/dist backend/static/dist.backup
          fi
          
          # Copiar nuevo build
          mkdir -p backend/static
          cp -r dist backend/static/
      
      - name: Copy .env file from server
        run: |
          # Copiar .env del servidor persistente al workspace del runner
          if [ -f "/home/bdoq/dev/sgm-contabilidad/.env" ]; then
            cp /home/bdoq/dev/sgm-contabilidad/.env .
            cp /home/bdoq/dev/sgm-contabilidad/.env backend/
            echo "✅ .env copied from server"
          else
            echo "❌ ERROR: .env not found at /home/bdoq/dev/sgm-contabilidad/.env"
            exit 1
          fi
      
      - name: Collect static files
        run: |
          cd backend
          docker compose exec -T django python manage.py collectstatic --noinput
      
      - name: Restart Django
        run: |
          cd backend
          docker compose restart django
      
      - name: Deployment notification
        run: |
          echo "✅ Deployment to DEVELOPMENT completed successfully!"
          echo "🌐 Frontend URL: http://172.17.11.22:8000"
          echo "📦 Build size: $(du -sh dist | cut -f1)"
